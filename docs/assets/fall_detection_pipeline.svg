<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 790" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Alert Card Gradient -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B1219" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1F0D12" stop-opacity="0.95" />
    </linearGradient>

    <!-- Cancel Card Gradient -->
    <linearGradient id="cancelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.85" />
    </linearGradient>

    <!-- SOS Card Gradient -->
    <linearGradient id="sosGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D0B14" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#150508" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow/Drop Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="redGlow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#EF4444" flood-opacity="0.3" />
    </filter>

    <filter id="cyanGlow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.25" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>

    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F87171" />
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399" />
    </marker>

    <style>
      .title-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; font-weight: 800; }
      .bold-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; font-weight: 700; }
      .semi-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; font-weight: 600; }
      .regular-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; font-weight: 400; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas Outer Container -->
  <rect width="1060" height="790" rx="20" fill="url(#canvasGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Background decorative grid dots pattern -->
  <g opacity="0.08" fill="#FFFFFF">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/>
    <circle cx="300" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/><circle cx="420" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/>
    <circle cx="540" cy="60" r="1.5"/><circle cx="600" cy="60" r="1.5"/><circle cx="660" cy="60" r="1.5"/><circle cx="720" cy="60" r="1.5"/>
    <circle cx="780" cy="60" r="1.5"/><circle cx="840" cy="60" r="1.5"/><circle cx="900" cy="60" r="1.5"/><circle cx="960" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="960" cy="120" r="1.5"/>
    <circle cx="60" cy="720" r="1.5"/><circle cx="960" cy="720" r="1.5"/>
  </g>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(40, 32)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <circle cx="13" cy="13" r="4" fill="#38BDF8" />
    <text x="24" y="17" fill="#38BDF8" font-size="11" class="semi-text" letter-spacing="1">ON-DEVICE SAFETY SYSTEM</text>

    <!-- Header Title -->
    <text x="0" y="52" fill="#F8FAFC" font-size="22" class="title-text">Fall Detection &amp; Automated SOS Escalation Pipeline</text>
    <text x="0" y="72" fill="#94A3B8" font-size="13" class="regular-text">High-Frequency 50 Hz Accelerometer Monitoring  •  Edge TFLite Inference  •  Multi-Channel Emergency Dispatch</text>
  </g>

  <!-- ==================== STAGE 1: SENSING & INGESTION ==================== -->
  <!-- Card 1: 3-Axis Accelerometer -->
  <g transform="translate(40, 130)" filter="url(#cardShadow)">
    <rect width="290" height="110" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="0" y="0" width="290" height="4" rx="2" fill="#38BDF8" />

    <!-- Icon: Accelerometer / Sensor Waves -->
    <rect x="18" y="20" width="38" height="38" rx="10" fill="#0284C7" fill-opacity="0.25" />
    <g transform="translate(25, 27)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M12 2v20M2 12h20" stroke-dasharray="1 3"/>
      <circle cx="12" cy="12" r="4" fill="#38BDF8"/>
      <path d="M5 5l14 14"/>
    </g>

    <!-- Title & Specs -->
    <text x="68" y="36" fill="#F1F5F9" font-size="15" class="bold-text">3-Axis Accelerometer</text>
    <text x="68" y="52" fill="#38BDF8" font-size="12" class="semi-text">50 Hz Continuous Sampling</text>

    <text x="18" y="80" fill="#94A3B8" font-size="12" class="regular-text">• 20 ms fixed hardware interval</text>
    <text x="18" y="98" fill="#94A3B8" font-size="12" class="regular-text">• Persistent Foreground Sensor Service</text>
  </g>

  <!-- Connector 1 -> 2 with Buffer Badge -->
  <g transform="translate(330, 185)">
    <line x1="0" y1="0" x2="68" y2="0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <!-- Sliding Window Badge -->
    <rect x="4" y="-22" width="60" height="18" rx="9" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="34" y="-9" fill="#CBD5E1" font-size="9" text-anchor="middle" class="semi-text">128 SAMPLES</text>
    <text x="34" y="16" fill="#64748B" font-size="9" text-anchor="middle" class="mono-text">50% OVERLAP</text>
  </g>

  <!-- Card 2: TFLite Neural Classifier -->
  <g transform="translate(405, 130)" filter="url(#cardShadow)">
    <rect width="310" height="110" rx="14" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5" />
    <rect x="0" y="0" width="310" height="4" rx="2" fill="#A855F7" />

    <!-- Icon: Neural Chip -->
    <rect x="18" y="20" width="38" height="38" rx="10" fill="#9333EA" fill-opacity="0.25" />
    <g transform="translate(25, 27)" stroke="#C084FC" stroke-width="1.8" fill="none">
      <rect x="4" y="4" width="16" height="16" rx="3" />
      <path d="M8 8h8v8H8z" fill="#C084FC" fill-opacity="0.3"/>
      <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3" stroke-linecap="round"/>
    </g>

    <!-- Title & Specs -->
    <text x="68" y="36" fill="#F1F5F9" font-size="15" class="bold-text">TFLite Neural Network</text>
    <text x="68" y="52" fill="#C084FC" font-size="12" class="mono-text">fall_model_int8.tflite</text>

    <text x="18" y="80" fill="#94A3B8" font-size="12" class="regular-text">• Dual-thread INT8 quantized model</text>
    <text x="18" y="98" fill="#94A3B8" font-size="12" class="regular-text">• Shape: [1, 128, 3] ➔ Sigmoid probability</text>
  </g>

  <!-- Connector 2 -> 3 with Threshold Badge -->
  <g transform="translate(715, 185)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
    <!-- Threshold Badge -->
    <rect x="6" y="-22" width="54" height="18" rx="9" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="33" y="-9" fill="#FCD34D" font-size="9" text-anchor="middle" class="semi-text">&gt; 0.95 SCORE</text>
  </g>

  <!-- Card 3: Dual-Window Verification -->
  <g transform="translate(785, 130)" filter="url(#cardShadow)">
    <rect width="235" height="110" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="0" y="0" width="235" height="4" rx="2" fill="#F59E0B" />

    <!-- Icon: Verification / Shield -->
    <rect x="18" y="20" width="38" height="38" rx="10" fill="#D97706" fill-opacity="0.25" />
    <g transform="translate(25, 27)" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l8 4v6c0 5.5-3.8 10.7-8 12-4.2-1.3-8-6.5-8-12V6l8-4z" />
      <path d="M9 12l2 2 4-4" />
    </g>

    <!-- Title & Specs -->
    <text x="68" y="36" fill="#F1F5F9" font-size="14" class="bold-text">Dual-Verification</text>
    <text x="68" y="52" fill="#FBBF24" font-size="11" class="semi-text">False Alarm Shield</text>

    <text x="18" y="80" fill="#94A3B8" font-size="11.5" class="regular-text">• 2 consecutive positive windows</text>
    <text x="18" y="98" fill="#94A3B8" font-size="11.5" class="regular-text">• 10s grace period on service start</text>
  </g>

  <!-- Vertical Connection Down to Alert Phase -->
  <g transform="translate(530, 240)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <rect x="-65" y="10" width="130" height="20" rx="10" fill="#450A0A" stroke="#EF4444" stroke-width="1" />
    <text x="0" y="24" fill="#FCA5A5" font-size="10" text-anchor="middle" class="bold-text">FALL CONFIRMED</text>
  </g>

  <!-- ==================== STAGE 2: EMERGENCY ALERT & COUNTDOWN ==================== -->
  <g transform="translate(40, 285)" filter="url(#redGlow)">
    <rect width="980" height="150" rx="16" fill="url(#alertGrad)" stroke="#EF4444" stroke-width="2" />
    <rect x="0" y="0" width="980" height="5" rx="2" fill="#EF4444" />

    <!-- Top Alert Banner -->
    <g transform="translate(24, 20)">
      <circle cx="16" cy="16" r="16" fill="#EF4444" />
      <!-- Siren Icon -->
      <g transform="translate(6, 6)" fill="#FFFFFF">
        <path d="M10 2a6 6 0 0 0-6 6v3.586l-.707.707A1 1 0 0 0 4 14h12a1 1 0 0 0 .707-1.707L16 11.586V8a6 6 0 0 0-6-6zM10 18a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/>
      </g>
      <text x="44" y="15" fill="#FEE2E2" font-size="16" class="bold-text">EMERGENCY ALERT SCREEN &amp; WARNING SIREN ACTIVATED</text>
      <text x="44" y="32" fill="#FCA5A5" font-size="12" class="regular-text">High-priority foreground escalation • Wakes device &amp; bypasses active lockscreen</text>
    </g>

    <!-- 3 Core Alert Features in Columns -->
    <!-- Column A: Lockscreen Override -->
    <g transform="translate(24, 75)">
      <rect width="295" height="58" rx="10" fill="#0F172A" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#F8FAFC" font-size="13" class="bold-text">🔓 Lockscreen Override</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="regular-text">FLAG_SHOW_WHEN_LOCKED &amp; Turn Screen On</text>
    </g>

    <!-- Column B: Max Siren & Strobe -->
    <g transform="translate(342, 75)">
      <rect width="295" height="58" rx="10" fill="#0F172A" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#F8FAFC" font-size="13" class="bold-text">🔊 Strobe &amp; Siren Alarm</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="regular-text">Looping audio siren + Camera LED flashlight strobe</text>
    </g>

    <!-- Column C: 30s Countdown Timer -->
    <g transform="translate(660, 75)">
      <rect width="295" height="58" rx="10" fill="#450A0A" fill-opacity="0.8" stroke="#EF4444" stroke-width="1.2" />
      <circle cx="28" cy="29" r="16" fill="#7F1D1D" stroke="#EF4444" stroke-width="2" />
      <text x="28" y="34" fill="#FEE2E2" font-size="13" text-anchor="middle" class="bold-text">30s</text>
      <text x="54" y="24" fill="#FEE2E2" font-size="13" class="bold-text">30-Second Verification</text>
      <text x="54" y="44" fill="#FCA5A5" font-size="11" class="regular-text">Interactive Swipe to Dismiss ("I am OK")</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: RESOLUTION & BRANCHING ==================== -->
  <!-- Split Paths from Alert Card -->
  <!-- Left Path: Cancelled -->
  <path d="M 280 435 L 280 480 L 220 480 L 220 505" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)" />
  <rect x="135" y="468" width="170" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1" />
  <text x="220" y="483" fill="#D1FAE5" font-size="11" text-anchor="middle" class="semi-text">User Swipes: "I am OK"</text>

  <!-- Right Path: Escalation (No Response) -->
  <path d="M 740 435 L 740 480 L 690 480 L 690 505" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="580" y="468" width="220" height="22" rx="11" fill="#7F1D1D" stroke="#EF4444" stroke-width="1" />
  <text x="690" y="483" fill="#FEE2E2" font-size="11" text-anchor="middle" class="bold-text">Timer Expires: No Cancellation</text>

  <!-- Left Card: False Alarm Dismissal -->
  <g transform="translate(40, 515)" filter="url(#cardShadow)">
    <rect width="320" height="220" rx="14" fill="url(#cancelGrad)" stroke="#10B981" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="4" rx="2" fill="#10B981" />

    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#10B981" />
      <path d="M11 16l3.5 3.5 7-7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="16" fill="#ECFDF5" font-size="15" class="bold-text">False Alarm Dismissed</text>
      <text x="42" y="32" fill="#A7F3D0" font-size="11.5" class="regular-text">User confirmed safety on device</text>
    </g>

    <g transform="translate(20, 80)">
      <text x="0" y="15" fill="#D1FAE5" font-size="12" class="semi-text">✓ Siren &amp; Torch Stopped Instantly</text>
      <text x="0" y="33" fill="#94A3B8" font-size="11.5" class="regular-text">Camera torch mode and MediaPlayer released</text>

      <text x="0" y="65" fill="#D1FAE5" font-size="12" class="semi-text">✓ Continuous Monitoring Resumed</text>
      <text x="0" y="83" fill="#94A3B8" font-size="11.5" class="regular-text">Sensor buffer cleared; 50 Hz background active</text>

      <text x="0" y="115" fill="#D1FAE5" font-size="12" class="semi-text">✓ Zero Emergency Dispatches</text>
      <text x="0" y="133" fill="#94A3B8" font-size="11.5" class="regular-text">Prevents false alerts to emergency responders</text>
    </g>
  </g>

  <!-- Right Container: Automated Emergency SOS Dispatch -->
  <g transform="translate(380, 515)" filter="url(#redGlow)">
    <rect width="640" height="220" rx="14" fill="url(#sosGrad)" stroke="#F43F5E" stroke-width="1.8" />
    <rect x="0" y="0" width="640" height="4" rx="2" fill="#F43F5E" />

    <!-- Container Header -->
    <g transform="translate(24, 20)">
      <circle cx="16" cy="16" r="16" fill="#F43F5E" />
      <g transform="translate(7, 7)" fill="#FFFFFF">
        <path d="M12 2L1 21h22L12 2zm0 3.5L20 19H4L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
      </g>
      <text x="44" y="16" fill="#FFF1F2" font-size="16" class="bold-text">Automated Multi-Channel SOS Escalation</text>
      <text x="44" y="32" fill="#FECDD3" font-size="12" class="regular-text">Concurrent execution via Kotlin Coroutines &amp; EmergencyActionManager</text>
    </g>

    <!-- Sub-Box 1: Automated SMS Dispatch -->
    <g transform="translate(24, 70)">
      <rect width="365" height="132" rx="10" fill="#1C0A10" fill-opacity="0.8" stroke="#E11D48" stroke-width="1" />
      <text x="14" y="24" fill="#FFE4E6" font-size="13" class="bold-text">📱 Automated Emergency SMS Dispatch</text>

      <!-- 4 SOS payload items -->
      <g transform="translate(14, 44)">
        <!-- GPS -->
        <circle cx="5" cy="5" r="3" fill="#38BDF8" />
        <text x="15" y="8" fill="#F1F5F9" font-size="11.5" class="semi-text">High-Accuracy GPS Coordinates</text>
        <text x="210" y="8" fill="#94A3B8" font-size="10.5" class="mono-text">(Google Maps URL)</text>

        <!-- Audio -->
        <circle cx="5" cy="25" r="3" fill="#A855F7" />
        <text x="15" y="28" fill="#F1F5F9" font-size="11.5" class="semi-text">5-Second Ambient Audio Clip</text>
        <text x="210" y="28" fill="#94A3B8" font-size="10.5" class="mono-text">(Firebase Cloud link)</text>

        <!-- Photo -->
        <circle cx="5" cy="45" r="3" fill="#F59E0B" />
        <text x="15" y="48" fill="#F1F5F9" font-size="11.5" class="semi-text">Emergency Camera Photo Snapshot</text>
        <text x="235" y="48" fill="#94A3B8" font-size="10.5" class="mono-text">(Front/Rear)</text>

        <!-- Medical -->
        <circle cx="5" cy="65" r="3" fill="#10B981" />
        <text x="15" y="68" fill="#F1F5F9" font-size="11.5" class="semi-text">Emergency Medical Profile</text>
        <text x="180" y="68" fill="#94A3B8" font-size="10.5" class="regular-text">(Blood type, allergies, notes)</text>
      </g>
    </g>

    <!-- Sub-Box 2: Auto Emergency Call -->
    <g transform="translate(405, 70)">
      <rect width="210" height="132" rx="10" fill="#1C0A10" fill-opacity="0.8" stroke="#E11D48" stroke-width="1" />
      <text x="14" y="24" fill="#FFE4E6" font-size="13" class="bold-text">📞 Auto Emergency Dial</text>

      <g transform="translate(14, 48)">
        <text x="0" y="10" fill="#FDA4AF" font-size="12" class="semi-text">• Direct Emergency Call</text>
        <text x="0" y="26" fill="#94A3B8" font-size="11" class="regular-text">Dials 112, 911, 115, or</text>
        <text x="0" y="40" fill="#94A3B8" font-size="11" class="regular-text">designated primary contact</text>

        <text x="0" y="62" fill="#FDA4AF" font-size="12" class="semi-text">• Hands-Free Speaker</text>
        <text x="0" y="78" fill="#94A3B8" font-size="11" class="regular-text">Automatic speakerphone</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(530, 765)">
    <text x="0" y="0" fill="#64748B" font-size="11.5" text-anchor="middle" class="regular-text">
      🔒 100% On-Device Neural Processing  •  Zero Cloud Latency for Sensor Inference  •  Privacy-First Architecture
    </text>
  </g>
</svg>
